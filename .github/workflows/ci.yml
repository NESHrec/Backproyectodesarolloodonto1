name: Backend release candidate CI

on:
  pull_request:
  push:
    branches: [dev, desarrollo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinica_test
          POSTGRES_USER: clinica_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica_test -d clinica_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: clinica_test
      TEST_DB_USER: clinica_test
      TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Start restricted SSH tunnel to SonarQube
        if: ${{ github.event_name == 'push' }}
        env:
          SONAR_SSH_PRIVATE_KEY: ${{ secrets.SONAR_SSH_PRIVATE_KEY }}
          SONAR_SSH_KNOWN_HOSTS: ${{ secrets.SONAR_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SONAR_SSH_PRIVATE_KEY" > "$HOME/.ssh/sonar-ci"
          printf '%s\n' "$SONAR_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/sonar-ci" "$HOME/.ssh/known_hosts"
          ssh -fN -i "$HOME/.ssh/sonar-ci" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 127.0.0.1:19001:127.0.0.1:9001 \
            sonar-ci@207.244.224.129
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            http://127.0.0.1:19001/api/system/status >/dev/null
      - name: SonarQube analysis and Quality Gate
        if: ${{ github.event_name == 'push' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.SONAR_TOKEN_DEV || secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ github.ref == 'refs/heads/dev' && 'clinica-serena-backend-dev' || 'clinica-serena-backend' }}
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Report SonarQube gate conditions
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.SONAR_TOKEN_DEV || secrets.SONAR_TOKEN }}
        run: |
          project_key='clinica-serena-backend'
          if [[ "$GITHUB_REF" == 'refs/heads/dev' ]]; then
            project_key='clinica-serena-backend-dev'
          fi
          curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$project_key" \
            | jq '{status:.projectStatus.status, conditions:[.projectStatus.conditions[] | {metricKey,status,errorThreshold,actualValue}]}'

  deploy-production:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/desarrollo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package the verified backend commit
        run: |
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" clinica-serena-api.jar
      - name: Build commit-addressed production image
        run: docker build --tag "clinica-serena-backend:${GITHUB_SHA}" .
      - name: Install restricted deployment key
        env:
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_DEPLOY_SSH_KEY" > "$HOME/.ssh/clinica-production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/clinica-production" "$HOME/.ssh/known_hosts"
      - name: Deploy and verify on the VPS
        run: |
          set -o pipefail
          docker save "clinica-serena-backend:${GITHUB_SHA}" \
            | gzip -1 \
            | ssh -i "$HOME/.ssh/clinica-production" \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                clinica-deploy@207.244.224.129
