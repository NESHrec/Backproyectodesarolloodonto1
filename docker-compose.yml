services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-serena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_serena}
      POSTGRES_USER: ${DB_USER:-clinica_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - clinica_serena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinica_app} -d ${DB_NAME:-clinica_serena}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinica_serena_pgdata:
