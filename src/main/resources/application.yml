spring:
  application:
    name: clinica-serena-api

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:clinica_serena}
    username: ${DB_USER:clinica_app}
    password: ${DB_PASSWORD:change-me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Swagger/OpenAPI deshabilitado por defecto. Se habilita solo con
# --spring.profiles.active=dev (ver application-dev.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
