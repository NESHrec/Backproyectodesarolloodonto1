openapi: 3.0.3
info:
  title: Clínica Serena API
  description: |
    Contrato oficial de la API de Clínica Serena. Es la fuente de verdad
    compartida entre el backend (Spring Boot), el frontend web (Next.js) y
    la app Android del paciente.

    Define los endpoints iniciales, agrupados en Health, Catálogo, Auth,
    Citas, Portal del paciente y Personal (ver tags).

    ## Estado de implementación
    - **Implementado en esta fase**: entidades y migración de paciente, cuenta
      y sesión; `POST /auth/login`, `GET /auth/me` y `POST /auth/logout` con
      BCrypt y Bearer opaco revocable.
    - **Implementado en esta fase**: autenticación Bearer separada para
      personal, creación administrativa de cuentas de recepción/médico,
      agenda persistida y registro de llegada con auditoría.
    - **Implementado para acceso web unificado**: `POST /auth/login-unified`
      resuelve la cuenta por correo y contraseña sin aceptar un rol del cliente.
      Si el mismo correo existe en paciente y personal, rechaza el acceso de
      forma genérica hasta que esa ambigüedad sea resuelta administrativamente.
    - **Implementado en esta fase**: vinculación administrativa de cuentas
      MEDICO con profesionales del catálogo, citas propias del profesional,
      expediente básico, historial de atenciones y registro inmutable de
      atención con diagnóstico y receta (`/medico/**`).
    - **Implementado para el portal del paciente**: consulta de recetas propias
      persistidas mediante `GET /pacientes/me/recetas`.
    - **Pendiente**: endpoint de chequeos del portal. La primera cuenta ADMIN se
      provisiona fuera del API mediante procedimiento operativo controlado.

    ## Convenciones
    - Todos los identificadores (`id`) se representan como `string`.
    - Todas las fechas/horas se transmiten en formato ISO 8601 (UTC salvo que
      se indique offset). La interfaz de usuario (web y Android) es
      responsable de mostrarlas convertidas a la zona horaria
      `America/Guatemala`.
    - Los montos monetarios se representan como enteros en centavos
      (`amountCents`), nunca como decimales.
    - Los errores siguen siempre el esquema `ApiError`.
  version: "0.1.0"

servers:
  - url: http://localhost:8080/api/v1
    description: Entorno local de desarrollo

tags:
  - name: Health
    description: Estado del servicio.
  - name: Catálogo
    description: Especialidades, médicos y disponibilidad. Endpoints públicos.
  - name: Auth
    description: Autenticación. Login público; el resto de la API requiere el token emitido aquí.
  - name: Citas
    description: Gestión de citas del paciente autenticado.
  - name: Portal del paciente
    description: Recetas y chequeos del paciente autenticado.
  - name: Personal
    description: Acceso y operaciones del personal con roles explícitos.
  - name: Atención médica
    description: |
      Datos clínicos del profesional vinculado a la sesión MEDICO. El profesional
      se obtiene del principal autenticado y el paciente de la cita persistida;
      nunca se aceptan `medicoId`, `patientId` ni roles enviados por el cliente.
      Todas las respuestas usan `Cache-Control: no-store`.

paths:
  /health:
    get:
      tags: [Health]
      summary: Verifica el estado del servicio
      description: Endpoint público, no requiere autenticación.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: El servicio está operativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: clinica-serena-api

  /especialidades:
    get:
      tags: [Catálogo]
      summary: Lista las especialidades disponibles
      description: Endpoint público.
      security: []
      operationId: listSpecialties
      responses:
        "200":
          description: Listado de especialidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialty"

  /medicos:
    get:
      tags: [Catálogo]
      summary: Lista los médicos/odontólogos
      description: Endpoint público. Puede filtrarse por especialidad.
      security: []
      operationId: listPractitioners
      parameters:
        - name: specialtyId
          in: query
          required: false
          description: Filtra médicos por especialidad.
          schema:
            type: string
      responses:
        "200":
          description: Listado de médicos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Practitioner"

  /medicos/{medicoId}/disponibilidad:
    get:
      tags: [Catálogo]
      summary: Consulta la disponibilidad de horarios de un médico
      description: Endpoint público.
      security: []
      operationId: getPractitionerAvailability
      parameters:
        - name: medicoId
          in: path
          required: true
          schema:
            type: string
        - name: desde
          in: query
          required: false
          description: Fecha ISO 8601 desde la cual consultar disponibilidad.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Fecha ISO 8601 hasta la cual consultar disponibilidad.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Slots de disponibilidad del médico.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
        "404":
          description: El médico no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/register:
    post:
      tags: [Auth]
      summary: Crea una identidad nueva de paciente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre: { type: string, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 8, maxLength: 72 }
      responses:
        "202": { description: Solicitud recibida; respuesta generica. }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verifica el correo con un token de un solo uso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Correo verificado. }
        "400": { description: Token invalido, vencido o utilizado. }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Solicita un nuevo enlace de verificacion sin revelar la cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "202": { description: Solicitud recibida; respuesta generica. }
  /auth/password-recovery:
    post:
      tags: [Auth]
      summary: Solicita recuperacion sin revelar si existe la cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "202": { description: Solicitud recibida; respuesta generica. }
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Cambia la contrasena y revoca todas las sesiones
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Contrasena actualizada y sesiones revocadas. }
        "400": { description: Token invalido, vencido o utilizado. }

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión como paciente
      description: |
        Endpoint público. Devuelve un token de acceso que debe enviarse como
        `Authorization: Bearer <token>` en los endpoints protegidos.
        La contraseña se verifica con BCrypt. La respuesta contiene un token
        Bearer opaco de vida limitada; el servidor persiste únicamente su hash
        y puede revocarlo con `POST /auth/logout`. El límite local predeterminado
        permite cinco fallos por correo y dirección remota en 60 segundos y
        aplica una pausa de 60 segundos antes de aceptar nuevos intentos.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login-unified:
    post:
      tags: [Auth]
      summary: Inicia sesión web como paciente o personal
      description: |
        Endpoint público para la pantalla web única de acceso. El servidor
        resuelve la identidad por correo normalizado y contraseña; el cliente
        no envía un rol. Devuelve una respuesta genérica para credenciales
        inválidas y para correos ambiguos presentes en ambos tipos de cuenta.
        Las cuentas de Android conservan los endpoints separados existentes.
      security: []
      operationId: loginUnified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso con el tipo de cuenta resuelto por el servidor.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedLoginResponse"
        "400":
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credenciales inválidas o correo ambiguo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      tags: [Auth]
      summary: Consulta la identidad del paciente autenticado
      description: Requiere un Bearer opaco vigente emitido por el login y el rol PACIENTE.
      security:
        - bearerAuth: []
      operationId: getCurrentPatientIdentity
      responses:
        "200":
          description: Identidad autenticada, sin datos clínicos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientIdentity"
        "401":
          description: Token ausente, inválido, expirado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca la sesión Bearer actual
      description: Requiere el rol PACIENTE. La revocación es inmediata.
      security:
        - bearerAuth: []
      operationId: logout
      responses:
        "204":
          description: Sesión revocada.
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /staff/auth/login:
    post:
      tags: [Personal]
      summary: Inicia sesión como personal
      description: Login público para cuentas ADMIN, RECEPCION o MEDICO. Devuelve un Bearer opaco separado del de pacientes.
      security: []
      operationId: loginStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /staff/auth/me:
    get:
      tags: [Personal]
      summary: Consulta la identidad del personal autenticado
      security:
        - bearerAuth: []
      operationId: getCurrentStaffIdentity
      responses:
        "200":
          description: Identidad y rol autenticados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffIdentity"
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /staff/auth/logout:
    post:
      tags: [Personal]
      summary: Revoca la sesión del personal
      security:
        - bearerAuth: []
      operationId: logoutStaff
      responses:
        "204": { description: Sesión revocada. }
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /staff/accounts:
    post:
      tags: [Personal]
      summary: Crea una cuenta habilitada de recepción o médico
      description: Requiere rol ADMIN. No permite crear el primer ADMIN desde el API.
      security:
        - bearerAuth: []
      operationId: createStaffAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAccountRequest"
      responses:
        "201":
          description: Cuenta habilitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "403": { description: Solo ADMIN puede crear cuentas de personal. }
        "409": { description: El correo ya existe. }
    get:
      tags: [Personal]
      summary: Lista las cuentas de personal con su estado de vinculación
      description: Requiere rol ADMIN. Las cuentas MEDICO sin profesional aparecen como `PENDIENTE_VINCULACION`.
      security:
        - bearerAuth: []
      operationId: listStaffAccounts
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StaffRole" }
      responses:
        "200":
          description: Cuentas ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /staff/accounts/{accountId}/practitioner:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Personal]
      summary: Asigna o corrige el profesional de una cuenta MEDICO
      description: |
        Requiere rol ADMIN; el administrador que actúa se toma del principal.
        La operación bloquea la cuenta y el profesional. La base de datos impide
        que un profesional quede asignado a dos cuentas activas incluso ante
        solicitudes concurrentes. Repetir la misma asignación no genera historial;
        cada cambio se registra en `historial_vinculacion_medico`.
      security:
        - bearerAuth: []
      operationId: linkStaffAccountPractitioner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkPractitionerRequest" }
      responses:
        "200":
          description: Cuenta vinculada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAccount" }
        "400":
          description: Cuerpo inválido o la cuenta no es MEDICO (`STAFF_ACCOUNT_NOT_MEDICAL`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La cuenta (`STAFF_ACCOUNT_NOT_FOUND`) o el profesional (`PRACTITIONER_NOT_FOUND`) no existe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: El profesional ya está asignado a otra cuenta activa (`PRACTITIONER_ALREADY_LINKED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      tags: [Personal]
      summary: Retira la vinculación de una cuenta MEDICO
      description: Requiere rol ADMIN. Conserva las atenciones previas y registra el cambio en el historial.
      security:
        - bearerAuth: []
      operationId: unlinkStaffAccountPractitioner
      responses:
        "200":
          description: Cuenta sin vinculación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAccount" }
        "400":
          description: La cuenta no es MEDICO (`STAFF_ACCOUNT_NOT_MEDICAL`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La cuenta no existe (`STAFF_ACCOUNT_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: La cuenta no tenía profesional asignado (`PRACTITIONER_NOT_LINKED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /staff/agenda:
    get:
      tags: [Personal]
      summary: Consulta la agenda persistida
      description: Requiere rol ADMIN o RECEPCION. El resultado está limitado a 100 filas.
      security:
        - bearerAuth: []
      operationId: listStaffAgenda
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Citas persistidas ordenadas por fecha.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReceptionAppointment" }
        "403": { description: Rol sin permiso para agenda. }

  /staff/agenda/{appointmentId}/arrival:
    post:
      tags: [Personal]
      summary: Registra la llegada de un paciente
      description: Requiere RECEPCION. La cita se bloquea durante la operación y una segunda llegada devuelve conflicto.
      security:
        - bearerAuth: []
      operationId: registerAppointmentArrival
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Llegada persistida con actor y hora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceptionAppointment" }
        "404": { description: La cita no existe. }
        "409": { description: La llegada ya existe o la cita no admite llegada. }

  /staff/billing/appointments:
    get:
      tags: [Cobros recepción]
      summary: Lista citas atendidas para cobro
      description: Requiere RECEPCION. Devuelve citas COMPLETADA con cargo, pagos y saldo calculado por backend.
      security:
        - bearerAuth: []
      operationId: listReceptionBillingAppointments
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Citas atendidas con estado financiero.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /staff/billing/appointments/{appointmentId}:
    get:
      tags: [Cobros recepción]
      summary: Consulta cargo, pagos y saldo de una cita
      security:
        - bearerAuth: []
      operationId: getReceptionBillingAppointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Estado financiero de la cita.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }

  /staff/billing/appointments/{appointmentId}/charge:
    put:
      tags: [Cobros recepción]
      summary: Fija el cargo de una cita atendida
      description: |
        Requiere RECEPCION. Solo se permite si la cita está COMPLETADA, tiene atención
        médica registrada y aún no tiene cargo. La operación queda auditada y no altera
        importes históricos. Moneda admitida: GTQ.
      security:
        - bearerAuth: []
      operationId: setReceptionAppointmentCharge
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAppointmentChargeRequest" }
      responses:
        "200":
          description: Cargo fijado y saldo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAppointment" }
        "400":
          description: Monto o moneda inválidos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }
        "409":
          description: Cita no cobrable, sin atención, o cargo ya definido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /staff/billing/appointments/{appointmentId}/payments:
    post:
      tags: [Cobros recepción]
      summary: Registra una constancia interna de pago recibido
      description: |
        Requiere RECEPCION. No procesa tarjetas ni transferencias bancarias: solo
        registra la constancia interna del pago recibido. El servidor calcula el saldo
        con la fila de la cita bloqueada, rechaza importes negativos o mayores al saldo
        y usa `idempotencyKey` para evitar duplicados por reintento. Un reintento de
        la misma intención devuelve el estado persistido sin crear otro pago; reutilizar
        la clave para datos distintos responde conflicto.
      security:
        - bearerAuth: []
      operationId: registerReceptionAppointmentPayment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPaymentRequest" }
      responses:
        "201":
          description: Pago registrado y saldo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAppointment" }
        "400":
          description: Datos inválidos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }
        "409":
          description: Cargo ausente, intención activa distinta, cita no cobrable o pago mayor al saldo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /staff/billing/appointments/{appointmentId}/payment-intent:
    put:
      tags: [Cobros recepción]
      summary: Prepara de forma persistente una intención de pago
      description: |
        Requiere RECEPCION. Conserva importe, método, referencia y clave en PostgreSQL,
        ligados a la cuenta autenticada. Si ya hay una intención, solo acepta exactamente
        los mismos datos; cualquier cambio o cita distinta responde `PAYMENT_INTENT_ACTIVE`.
      security:
        - bearerAuth: []
      operationId: prepareReceptionPaymentIntent
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPaymentRequest" }
      responses:
        "200":
          description: Intención preparada o la misma intención recuperada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "400": { description: Datos inválidos. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }
        "409": { description: Existe otra intención activa o la cita no admite el pago. }

  /staff/billing/payment-intent:
    get:
      tags: [Cobros recepción]
      summary: Recupera la intención activa de la cuenta autenticada
      security:
        - bearerAuth: []
      operationId: getReceptionPaymentIntent
      responses:
        "200":
          description: Intención activa, incluidos sus datos inmutables y estado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: La cuenta no tiene una intención activa. }
    delete:
      tags: [Cobros recepción]
      summary: Reconoce y cierra una intención completada
      description: Solo elimina el bloqueo si el backend prueba que existe exactamente el pago persistido con la misma clave y datos.
      security:
        - bearerAuth: []
      operationId: acknowledgeReceptionPaymentIntent
      responses:
        "204": { description: Evidencia verificada; intención cerrada. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No existe una intención activa. }
        "409": { description: La intención todavía no tiene evidencia de pago persistido. }

  /staff/billing/payment-intent/commit:
    post:
      tags: [Cobros recepción]
      summary: Ejecuta o reintenta la intención persistida
      description: |
        No recibe datos de pago del cliente. Usa exclusivamente la intención guardada y
        su clave; una repetición devuelve el mismo único pago. La intención permanece
        `COMPLETADA` hasta que el cliente verifique historial y la reconozca.
      security:
        - bearerAuth: []
      operationId: commitReceptionPaymentIntent
      responses:
        "201":
          description: Pago único persistido y saldo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No existe intención, o ya no puede aplicarse al saldo. }

  /medico/citas:
    get:
      tags: [Atención médica]
      summary: Lista solo las citas del profesional vinculado
      description: |
        Requiere rol MEDICO con vinculación. Rango predeterminado: desde 7 días
        antes de ahora hasta 60 días después. Resultado limitado a 100 filas.
      security:
        - bearerAuth: []
      operationId: listOwnMedicalAppointments
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Citas propias ordenadas por fecha.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicalAppointment" }
        "400":
          description: Límite (`LIMIT_INVALID`) o rango (`DATE_RANGE_INVALID`) inválido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MedicalForbidden" }

  /medico/citas/{appointmentId}:
    get:
      tags: [Atención médica]
      summary: Abre una cita propia con su atención, si existe
      security:
        - bearerAuth: []
      operationId: getOwnMedicalAppointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Cita y atención documentada (`attention` es `null` si aún no existe).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalAppointmentDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MedicalForbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }

  /medico/citas/{appointmentId}/expediente:
    get:
      tags: [Atención médica]
      summary: Consulta el expediente básico del paciente de una cita propia
      description: |
        Devuelve los datos básicos del paciente y todas sus atenciones registradas,
        de cualquier profesional, en orden descendente. `recordId` es `null` hasta
        que se documenta la primera atención del paciente.
      security:
        - bearerAuth: []
      operationId: getMedicalRecordForAppointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Expediente e historial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MedicalForbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }
        "409":
          description: La cita histórica no está asociada a un paciente registrado (`PATIENT_RECORD_UNAVAILABLE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /medico/citas/{appointmentId}/atencion:
    post:
      tags: [Atención médica]
      summary: Documenta la atención, el diagnóstico y la receta de una cita propia
      description: |
        Flujo presencial. Dentro de la misma transacción, con la fila de la cita
        bloqueada, el servidor exige que:
        1. la cita pertenezca al profesional vinculado al principal (si no, `404`);
        2. no tenga atención previa y esté `PENDIENTE` o `CONFIRMADA`;
        3. su hora programada ya haya comenzado (`scheduledAt <= ahora`, comparando
           instantes con el reloj del servidor);
        4. recepción haya registrado la llegada (`arrivalAt` no nulo).
        Si alguna regla falla se responde `409` y no se crea atención, receta ni
        expediente, ni cambia el estado de la cita. Si todas se cumplen, la cita pasa
        a `COMPLETADA` en la misma transacción. Autor, profesional, paciente y fecha
        se derivan del principal y de la cita. Existe una sola atención por cita y
        las atenciones y recetas guardadas no admiten modificaciones.
      security:
        - bearerAuth: []
      operationId: recordMedicalAttention
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordAttentionRequest" }
      responses:
        "201":
          description: Atención registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attention" }
        "400":
          description: Datos inválidos o campos no permitidos (`VALIDATION_ERROR`, `INVALID_REQUEST`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/MedicalForbidden" }
        "404": { $ref: "#/components/responses/AppointmentNotFound" }
        "409":
          description: |
            Se informa la primera regla incumplida, en este orden:
            `ATTENTION_ALREADY_RECORDED` si la cita ya tiene atención,
            `APPOINTMENT_NOT_DOCUMENTABLE` si está cancelada o completada,
            `APPOINTMENT_NOT_STARTED` si su hora programada aún no comienza,
            `ARRIVAL_NOT_REGISTERED` si recepción no registró la llegada, o
            `PATIENT_RECORD_UNAVAILABLE` si no tiene paciente registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /citas:
    post:
      tags: [Citas]
      summary: Agenda una nueva cita
      description: |
        Requiere autenticación con rol `PACIENTE`. El paciente se obtiene del
        Bearer validado por el servidor; la petición no acepta `patientId`.
      security:
        - bearerAuth: []
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
      responses:
        "201":
          description: Cita creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Bloque inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Horario ya reservado o no disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pacientes/me/citas:
    get:
      tags: [Portal del paciente]
      summary: Lista las citas del paciente autenticado
      description: Requiere autenticación con rol `PACIENTE`.
      security:
        - bearerAuth: []
      operationId: listMyAppointments
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
      responses:
        "200":
          description: Listado de citas del paciente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pacientes/me/recetas:
    get:
      tags: [Portal del paciente]
      summary: Lista las recetas del paciente autenticado
      description: |
        Requiere autenticación con rol `PACIENTE`. La identidad procede
        exclusivamente del Bearer opaco validado; no acepta `patientId` en ruta,
        query ni cuerpo. Devuelve las atenciones propias que contienen al menos
        un medicamento, ordenadas desde la emisión más reciente. No inventa
        vigencia ni fechas distintas de las persistidas.
      security:
        - bearerAuth: []
      operationId: listMyPrescriptions
      responses:
        "200":
          description: Lista de recetas propias; arreglo vacío si no existen.
          headers:
            Cache-Control:
              description: La respuesta clínica no se almacena en caché.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: La identidad autenticada no tiene rol PACIENTE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /pacientes/me/chequeos:
    get:
      tags: [Portal del paciente]
      summary: Lista los chequeos/consultas realizadas al paciente autenticado
      description: Requiere autenticación con rol `PACIENTE`.
      security:
        - bearerAuth: []
      operationId: listMyCheckups
      responses:
        "200":
          description: Listado de chequeos del paciente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkup"
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Token opaco emitido por `POST /auth/login`. Solo se almacena su hash.
        Expira en 1800 segundos por defecto y se revoca con `POST /auth/logout`.

  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, maxLength: 36 }

  responses:
    Unauthenticated:
      description: Sin sesión válida (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: La sesión es válida pero su rol no tiene permiso (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    MedicalForbidden:
      description: |
        `FORBIDDEN` para ADMIN, RECEPCION o paciente; `PRACTITIONER_LINK_REQUIRED`
        para una cuenta MEDICO sin profesional asignado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    AppointmentNotFound:
      description: La cita no existe o pertenece a otro profesional (`APPOINTMENT_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    StaffRole:
      type: string
      enum: [ADMIN, RECEPCION, MEDICO]
    StaffLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    StaffIdentity:
      type: object
      required: [accountId, email, fullName, role, practitionerLinkStatus]
      properties:
        accountId: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/StaffRole" }
        practitionerLinkStatus: { $ref: "#/components/schemas/PractitionerLinkStatus" }
        practitionerId: { type: string, nullable: true }
    PractitionerLinkStatus:
      type: string
      enum: [VINCULADA, PENDIENTE_VINCULACION, NO_APLICA]
      description: |
        Derivado de la relación persistida. `PENDIENTE_VINCULACION` identifica
        cuentas MEDICO que aún no pueden acceder a datos clínicos; `NO_APLICA`
        corresponde a ADMIN y RECEPCION.
    LinkPractitionerRequest:
      type: object
      additionalProperties: false
      required: [practitionerId]
      properties:
        practitionerId: { type: string, maxLength: 36 }
    CreateStaffAccountRequest:
      type: object
      additionalProperties: false
      required: [email, fullName, role, password]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 160 }
        role: { type: string, enum: [RECEPCION, MEDICO] }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    StaffAccount:
      type: object
      required: [accountId, email, fullName, role, status, practitionerLinkStatus]
      properties:
        accountId: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/StaffRole" }
        status: { type: string, enum: [ACTIVA, BLOQUEADA] }
        practitionerLinkStatus: { $ref: "#/components/schemas/PractitionerLinkStatus" }
        practitionerId: { type: string, nullable: true }
        practitionerName: { type: string, nullable: true }
        practitionerLinkedAt: { type: string, format: date-time, nullable: true }
    MedicalAppointment:
      type: object
      required: [id, patientId, practitionerId, specialtyId, specialtyName, scheduledAt, status,
                 attentionRecorded, canRecordAttention, attentionBlockers]
      properties:
        id: { type: string }
        patientId: { type: string }
        patientName: { type: string, nullable: true }
        practitionerId: { type: string }
        specialtyId: { type: string }
        specialtyName: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        notes: { type: string, nullable: true }
        arrivalAt: { type: string, format: date-time, nullable: true }
        attentionRecorded: { type: boolean }
        canRecordAttention:
          type: boolean
          description: "`true` solo si `attentionBlockers` está vacío. Es informativo: el servidor revalida al guardar."
        attentionBlockers:
          type: array
          description: Reglas que hoy impiden documentar la cita, calculadas con el reloj del servidor.
          items:
            type: string
            enum: [ATTENTION_ALREADY_RECORDED, STATUS_NOT_DOCUMENTABLE, NOT_STARTED, ARRIVAL_NOT_REGISTERED]
    MedicalAppointmentDetail:
      type: object
      required: [appointment]
      properties:
        appointment: { $ref: "#/components/schemas/MedicalAppointment" }
        attention:
          allOf:
            - $ref: "#/components/schemas/Attention"
          nullable: true
    ClinicalRecord:
      type: object
      required: [patient, attentions]
      properties:
        patient:
          type: object
          required: [id, status, registeredAt]
          properties:
            id: { type: string }
            fullName: { type: string, nullable: true }
            status: { type: string, enum: [ACTIVO, INACTIVO] }
            registeredAt: { type: string, format: date-time }
        recordId: { type: string, nullable: true }
        recordCreatedAt: { type: string, format: date-time, nullable: true }
        attentions:
          type: array
          items: { $ref: "#/components/schemas/Attention" }
    RecordAttentionRequest:
      type: object
      additionalProperties: false
      required: [reason, diagnosis, prescription]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000, description: Motivo de consulta. }
        findings: { type: string, maxLength: 2000, nullable: true, description: Hallazgos o exploración. }
        diagnosis: { type: string, minLength: 3, maxLength: 1000 }
        treatmentPlan: { type: string, maxLength: 2000, nullable: true, description: Plan e indicaciones generales. }
        prescription:
          type: array
          maxItems: 10
          description: Medicamentos de la receta; puede estar vacía si no se prescribe ninguno.
          items: { $ref: "#/components/schemas/AttentionPrescriptionItemRequest" }
    AttentionPrescriptionItemRequest:
      type: object
      additionalProperties: false
      required: [medicine, dose, frequency, duration]
      properties:
        medicine: { type: string, minLength: 2, maxLength: 160 }
        dose: { type: string, maxLength: 80 }
        frequency: { type: string, maxLength: 80 }
        duration: { type: string, maxLength: 80 }
        instructions: { type: string, maxLength: 500, nullable: true }
    Attention:
      type: object
      required: [id, appointmentId, practitionerId, authorAccountId, reason, diagnosis, recordedAt, prescription]
      properties:
        id: { type: string }
        appointmentId: { type: string }
        appointmentScheduledAt: { type: string, format: date-time }
        practitionerId: { type: string }
        practitionerName: { type: string }
        authorAccountId: { type: string }
        authorName: { type: string }
        reason: { type: string }
        findings: { type: string, nullable: true }
        diagnosis: { type: string }
        treatmentPlan: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
        prescription:
          type: array
          items:
            type: object
            required: [order, medicine, dose, frequency, duration]
            properties:
              order: { type: integer, minimum: 1, maximum: 10 }
              medicine: { type: string }
              dose: { type: string }
              frequency: { type: string }
              duration: { type: string }
              instructions: { type: string, nullable: true }
    ReceptionAppointment:
      type: object
      required: [id, patientId, practitionerId, specialtyId, scheduledAt, status]
      properties:
        id: { type: string }
        patientId: { type: string }
        practitionerId: { type: string }
        specialtyId: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        arrivalAt: { type: string, format: date-time, nullable: true }
        arrivalByAccountId: { type: string, nullable: true }
    SetAppointmentChargeRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { type: integer, format: int64, minimum: 1, description: Importe entero en centavos de GTQ. }
        currency: { type: string, enum: [GTQ], default: GTQ }
    RegisterPaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method, idempotencyKey]
      properties:
        amount: { type: integer, format: int64, minimum: 1, description: Importe entero en centavos de GTQ. }
        method: { type: string, enum: [EFECTIVO, TRANSFERENCIA, OTRO] }
        reference: { type: string, maxLength: 120, nullable: true }
        idempotencyKey: { type: string, maxLength: 80 }
    PaymentIntent:
      type: object
      required: [appointmentId, amount, method, idempotencyKey, status, createdAt]
      properties:
        appointmentId: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        method: { type: string, enum: [EFECTIVO, TRANSFERENCIA, OTRO] }
        reference: { type: string, maxLength: 120, nullable: true }
        idempotencyKey: { type: string, maxLength: 80 }
        status: { type: string, enum: [PREPARADA, COMPLETADA] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    BillingPayment:
      type: object
      required: [id, appointmentId, registeredByAccountId, amount, currency, method, registeredAt]
      properties:
        id: { type: string }
        appointmentId: { type: string }
        registeredByAccountId: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string, enum: [GTQ] }
        method: { type: string, enum: [EFECTIVO, TRANSFERENCIA, OTRO] }
        reference: { type: string, nullable: true }
        idempotencyKey: { type: string }
        registeredAt: { type: string, format: date-time }
    BillingAppointment:
      type: object
      required: [id, patientId, practitionerId, specialtyId, scheduledAt, status, attended,
                 currency, paidAmount, chargeDefined, payments]
      properties:
        id: { type: string }
        patientId: { type: string }
        practitionerId: { type: string }
        specialtyId: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        attended: { type: boolean }
        chargeAmount: { type: integer, format: int64, nullable: true }
        currency: { type: string, enum: [GTQ] }
        paidAmount: { type: integer, format: int64 }
        balanceAmount: { type: integer, format: int64, nullable: true }
        chargeDefined: { type: boolean }
        payments:
          type: array
          items: { $ref: "#/components/schemas/BillingPayment" }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }
    AppointmentStatus:
      type: string
      enum: [PENDIENTE, CONFIRMADA, CANCELADA, COMPLETADA]

    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [practitionerId, specialtyId, scheduledAt]
      properties:
        practitionerId:
          type: string
          minLength: 1
        specialtyId:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000

    Specialty:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          example: Odontología general
        description:
          type: string

    Practitioner:
      type: object
      required: [id, fullName, specialtyId]
      properties:
        id:
          type: string
        fullName:
          type: string
          example: Dra. Ana López
        specialtyId:
          type: string
        specialtyName:
          type: string
        licenseNumber:
          type: string

    AvailabilitySlot:
      type: object
      required: [id, practitionerId, startAt, endAt]
      properties:
        id:
          type: string
        practitionerId:
          type: string
        startAt:
          type: string
          format: date-time
          description: ISO 8601. La UI la muestra convertida a America/Guatemala.
        endAt:
          type: string
          format: date-time
          description: ISO 8601. La UI la muestra convertida a America/Guatemala.

    Appointment:
      type: object
      required: [id, patientId, practitionerId, specialtyId, scheduledAt, status]
      properties:
        id:
          type: string
        patientId:
          type: string
        practitionerId:
          type: string
        specialtyId:
          type: string
        scheduledAt:
          type: string
          format: date-time
          description: ISO 8601. La UI la muestra convertida a America/Guatemala.
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        notes:
          type: string
        amountCents:
          type: integer
          format: int64
          description: Costo de la consulta en centavos, si aplica.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Prescription:
      type: object
      description: Receta derivada de una atención persistida que contiene medicamentos.
      required: [id, appointmentId, appointmentScheduledAt, issuedAt, practitionerId, practitionerName, items]
      properties:
        id:
          type: string
          description: Identificador de la atención que originó la receta.
        appointmentId:
          type: string
        appointmentScheduledAt:
          type: string
          format: date-time
          description: Fecha y hora persistida de la cita.
        practitionerId:
          type: string
        practitionerName:
          type: string
        issuedAt:
          type: string
          format: date-time
          description: Fecha y hora real en que se registró la atención y su receta.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PrescriptionItem"

    PrescriptionItem:
      type: object
      required: [id, order, medicine, dose, frequency, duration]
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 1
          maximum: 10
        medicine:
          type: string
          example: Medicamento prescrito
        dose:
          type: string
          example: 1 tableta
        frequency:
          type: string
          example: Cada 8 horas
        duration:
          type: string
          example: 5 días
        instructions:
          type: string
          nullable: true

    Checkup:
      type: object
      required: [id, patientId, practitionerId, performedAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        practitionerId:
          type: string
        performedAt:
          type: string
          format: date-time
          description: ISO 8601. La UI la muestra convertida a America/Guatemala.
        diagnosis:
          type: string
        notes:
          type: string
        amountCents:
          type: integer
          format: int64
          description: Costo del chequeo en centavos, si aplica.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer

    UnifiedLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, accountType, role]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer }
        accountType: { type: string, enum: [PACIENTE, PERSONAL] }
        role: { type: string, enum: [PACIENTE, ADMIN, RECEPCION, MEDICO] }

    PatientIdentity:
      type: object
      required: [patientId, email, accountStatus]
      properties:
        patientId:
          type: string
          description: Identificador estable del paciente autenticado.
        email:
          type: string
          format: email
        accountStatus:
          type: string
          enum: [ACTIVA]

    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Datos inválidos
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: fecha
              message:
                type: string
                example: La fecha es obligatoria
